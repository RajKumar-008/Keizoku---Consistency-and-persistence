spring.application.name=keizoku
server.port=8080

# Default Database: File-backed persistent H2 in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:file:./data/dayforgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security & JWT Configuration
dayforge.jwt.secret=4c6e9a72b8d145f3e9a08123456789abcdef4c6e9a72b8d145f3e9a08123456789abcdef
dayforge.jwt.expiration-ms=86400000

# File Upload / Multipart limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.dayforge=INFO
logging.level.org.springframework.security=WARN

