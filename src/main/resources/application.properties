spring.application.name=keizoku
server.port=${PORT:8080}

# Active Profile: Defaults to 'dev' (H2 local) if not set.
# Set SPRING_PROFILES_ACTIVE=supabase or pass --spring.profiles.active=supabase for Supabase PostgreSQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security & JWT Configuration
dayforge.jwt.secret=4c6e9a72b8d145f3e9a08123456789abcdef4c6e9a72b8d145f3e9a08123456789abcdef
dayforge.jwt.expiration-ms=86400000

# File Upload / Multipart limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration (Never exposes sensitive database credentials)
logging.level.com.dayforge=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.com.zaxxer.hikari=INFO
